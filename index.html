  <div id="root"></div>
  <script>
    // --- EmailJS Config ---
    // Please set your actual credentials here:
    const EMAILJS_PUBLIC_KEY = "Yc4gpMVIpo28UJALy";
    const EMAILJS_SERVICE_ID = "service_07oa5oa";
    const EMAILJS_TEMPLATE_ID = "template_g81x7ri";

    if (EMAILJS_PUBLIC_KEY !== "YOUR_PUBLIC_KEY") {
      emailjs.init(EMAILJS_PUBLIC_KEY);
    }

    window.onerror = function (msg, url, lineNo, columnNo, error) {
      const errorStack = error ? error.stack : 'N/A';

      // Send via EmailJS if configured
      if (typeof emailjs !== 'undefined' && EMAILJS_PUBLIC_KEY !== "YOUR_PUBLIC_KEY") {

        if (window.location.hostname !== "localhost") {
          emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
            error_message: msg,
            error_url: url,
            error_line: lineNo,
            error_column: columnNo,
            error_stack: errorStack,
            user_agent: navigator.userAgent,
            email: "rilhi22@gmail.com",
            timestamp: new Date().toISOString()
          }).then(
            () => console.log('Error report sent via EmailJS'),
            (err) => console.error('Failed to send error via EmailJS', err)
          );
        }

        return false;
      };
  </script>
